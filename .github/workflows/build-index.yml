name: Build pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build game and world designer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build pages
        run: npm run build

      - name: Verify artifact
        run: test -s dist/index.html && test -s dist/designer.html

      - name: Upload pages and page resources
        uses: actions/upload-artifact@v4
        with:
          name: book-agent-pages
          path: |
            dist/index.html
            dist/designer.html
            dist/robots.txt
          if-no-files-found: error
          retention-days: 30
