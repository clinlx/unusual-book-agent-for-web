name: Protect root README

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readme-protection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify approved README content
        run: node --test tests/readme-protection.test.js
